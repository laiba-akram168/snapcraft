name: snapcraft
description: AI Powered Photo Editor & Collage Maker
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Image Processing
  image: ^4.1.3
  image_picker: ^1.0.7
  photo_manager: ^3.0.0
  image_cropper: ^12.2.1

  # Filters & Effects
  screenshot: ^2.3.0

  # Real-time AI (Socket.io)
  socket_io_client: ^2.0.3+1

  # Networking
  dio: ^5.4.1

  # Storage
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2

  # UI
  google_fonts: ^6.1.0
  flutter_staggered_grid_view: ^0.7.0
  lottie: ^3.0.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  gap: ^3.0.1
  dotted_border: ^2.1.0
  animated_text_kit: ^4.2.2

  # Collage
  matrix_gesture_detector: ^0.2.0-nullsafety.1

  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/